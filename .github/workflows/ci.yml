name: CI

# Сборка, тесты и статические проверки на каждый push и pull request.
# Тесты выполняются на обеих целевых платформах: Linux и Windows.
# Desktop-джобы отдельно проверяют Electron, smoke под xvfb и упаковку.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    name: Сборка и тесты (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Проверки переиспользуют цели Makefile, чтобы локальный результат
      # совпадал с результатом CI.
      - name: Проверки (make check)
        run: make check

      - name: Тесты с детектором гонок
        run: make test-race

      - name: Порог покрытия
        run: make cover-check

      - name: Сборка команд
        run: make build

      - name: Проверка конфигурации релиза
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  test-windows:
    name: Сборка и тесты (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
      CC: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # SQLCipher требует cgo. GitHub-раннер не держит MinGW в PATH,
      # поэтому ставим его через MSYS2 и добавляем mingw64/bin.
      - name: Установить MinGW для cgo
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Добавить MinGW в PATH
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      - name: Сборка команд
        run: go build ./...

  desktop-linux:
    name: Desktop (Linux, smoke и пакет)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Проверки (typecheck, unit-тесты, сборка)
        run: npm run check

      - name: Собрать asledgerd для smoke-теста
        run: npm run build:backend

      - name: Установить xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Окно Electron запускается в виртуальном X-сервере; тест проверяет
      # healthcheck, журнал и остановку asledgerd.
      - name: Smoke-тест Electron
        run: xvfb-run -a npm run test:e2e

      - name: Собрать Linux-пакет
        run: npm run package:dist

      - name: Проверить пакет
        run: npm run verify:package

      - name: Приложить Linux-артефакты
        uses: actions/upload-artifact@v4
        with:
          name: asledger-desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows, сборка и пакет)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Установить MinGW для cgo
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Добавить MinGW в PATH
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: Установить зависимости
        run: npm ci

      - name: Проверки (typecheck, unit-тесты, сборка)
        run: npm run check

      - name: Собрать Windows-пакет
        run: npm run package:win

      - name: Проверить пакет
        run: npm run verify:package:win

      - name: Приложить Windows-артефакты
        uses: actions/upload-artifact@v4
        with:
          name: asledger-desktop-windows
          path: desktop/release/*.exe
          if-no-files-found: error

  # macOS не входит в MVP v1.3.2: нет сертификата и нотаризации (#145).

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Запрет типов с плавающей точкой в денежном коде
        run: make lint-money

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Собрать asledgerd для интеграционных тестов
        working-directory: .
        run: make build

      # android-actions/setup-android@v3 вызывает устаревший пакет `tools`,
      # которого нет в cmdline-tools 16. Устанавливаем нужные пакеты напрямую.
      - name: Установить Android SDK 35 и 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка, unit-тесты, покрытие, lint и ktlint
        env:
          ASLEDGERD_BIN: ${{ github.workspace }}/bin/asledgerd
        run: >-
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
          verifyDataCoverage lintDebug ktlintCheck

      - name: Приложить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asledger-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
