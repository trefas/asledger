name: CI

# Сборка, тесты и статические проверки на каждый push и pull request.
# Тесты выполняются на обеих целевых платформах: Linux и Windows.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    name: Сборка и тесты (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Проверки переиспользуют цели Makefile, чтобы локальный результат
      # совпадал с результатом CI.
      - name: Проверки (make check)
        run: make check

      - name: Тесты с детектором гонок
        run: make test-race

      - name: Порог покрытия
        run: make cover-check

      - name: Сборка команд
        run: make build

      - name: Проверка конфигурации релиза
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  test-windows:
    name: Сборка и тесты (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      - name: Сборка команд
        run: go build ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Запрет типов с плавающей точкой в денежном коде
        run: make lint-money

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Собрать asledgerd для интеграционных тестов
        working-directory: .
        run: make build

      # android-actions/setup-android@v3 вызывает устаревший пакет `tools`,
      # которого нет в cmdline-tools 16. Устанавливаем нужные пакеты напрямую.
      - name: Установить Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка, unit-тесты, покрытие, lint и ktlint
        env:
          ASLEDGERD_BIN: ${{ github.workspace }}/bin/asledgerd
        run: >-
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
          verifyDataCoverage lintDebug ktlintCheck

      - name: Приложить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asledger-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
