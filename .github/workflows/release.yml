name: Release

# Релиз публикуется только по тегу v* и только после зелёных проверок.
# GoReleaser собирает linux/amd64, linux/arm64 и windows/amd64; отдельная
# джоба собирает подписанный Android APK и прикладывает его к релизу.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Проверки перед релизом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Статические проверки
        run: make check

      - name: Тесты с детектором гонок
        run: make test-race

      - name: Порог покрытия
        run: make cover-check

      - name: Версия совпадает с тегом
        run: |
          make build VERSION="${GITHUB_REF_NAME}"
          ./bin/asledgerctl version | grep -F "${GITHUB_REF_NAME}"
          ./bin/asledgerd --version | grep -F "${GITHUB_REF_NAME}"

  android:
    name: Android (release APK)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Бинарник нужен JVM-интеграционному тесту Android-клиента.
      - name: Собрать asledgerd
        working-directory: .
        run: make build

      - name: Подготовить ключ подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Не задан секрет ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asledger-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/asledger-release.jks" >> "$GITHUB_ENV"

      - name: Версия из тега
        run: |
          version="${GITHUB_REF_NAME#v}"
          code="$(echo "$version" | awk -F. '{ printf "%d", $1 * 10000 + $2 * 100 + $3 }')"
          echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "APK_NAME=asledger-$version.apk" >> "$GITHUB_ENV"

      # android-actions/setup-android@v3 вызывает устаревший пакет `tools`,
      # которого нет в cmdline-tools 16. Устанавливаем нужные пакеты напрямую.
      - name: Установить Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты, lint и подписанный APK
        env:
          ASLEDGERD_BIN: ${{ github.workspace }}/bin/asledgerd
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon testDebugUnitTest verifyDataCoverage
          lintDebug ktlintCheck assembleRelease

      - name: Проверить подпись и версию APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n1)"
          "$apksigner" verify --print-certs "$apk"
          "$aapt" dump badging "$apk" | grep -F "versionName='${ANDROID_VERSION_NAME}'"
          "$aapt" dump badging "$apk" | grep -F "versionCode='${ANDROID_VERSION_CODE}'"
          "$aapt" dump badging "$apk" | grep -F "sdkVersion:'34'"

      - name: Подготовить APK и SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/android-release/${APK_NAME}"
          cd "$RUNNER_TEMP/android-release"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"

      - name: Приложить APK
        uses: actions/upload-artifact@v4
        with:
          name: asledger-android-release
          path: ${{ runner.temp }}/android-release/*
          if-no-files-found: error

  release:
    name: Публикация релиза
    needs: [test, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: asledger-android-release
          path: ${{ runner.temp }}/android-release

      - name: Загрузить APK в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "$RUNNER_TEMP"/android-release/* --clobber
          gh release view "${GITHUB_REF_NAME}" \
            --json assets --jq '.assets[].name'
