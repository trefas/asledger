name: Release

# Релиз публикуется только по тегу v* и только после зелёных проверок.
# GoReleaser собирает linux/amd64, linux/arm64 и windows/amd64; отдельные
# джобы собирают подписанный Android APK и desktop-пакеты Linux/Windows,
# затем прикладывают их к GitHub Release вместе с SHA-256.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Проверки перед релизом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Статические проверки
        run: make check

      - name: Тесты с детектором гонок
        run: make test-race

      - name: Порог покрытия
        run: make cover-check

      - name: Версия совпадает с тегом
        run: |
          make build VERSION="${GITHUB_REF_NAME}"
          ./bin/asledgerctl version | grep -F "${GITHUB_REF_NAME}"
          ./bin/asledgerd --version | grep -F "${GITHUB_REF_NAME}"

  prepare:
    name: Черновик релиза и серверные артефакты
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GoReleaser создаёт черновик релиза и загружает в него серверные
      # артефакты. Остальные job добавляют свои файлы напрямую в черновик,
      # поэтому artifact storage GitHub Actions не используется.
      - name: GoReleaser (cgo, cross, draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e CGO_ENABLED=1 \
            -v "$PWD":/go/src/github.com/trefas/asledger \
            -w /go/src/github.com/trefas/asledger \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.10 \
            release --clean --draft

      - name: Проверить черновик
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --json isDraft,assets --jq '{isDraft, assets: [.assets[].name]}'
          test "$(gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --json isDraft --jq '.isDraft')" = "true"

  android:
    name: Android (release APK)
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Бинарник нужен JVM-интеграционному тесту Android-клиента.
      - name: Собрать asledgerd
        working-directory: .
        run: make build

      - name: Подготовить ключ подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Не задан секрет ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asledger-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/asledger-release.jks" >> "$GITHUB_ENV"

      - name: Версия из тега
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Для prerelease-тега v1.2.3-rc1 код считается по 1.2.3.
          code_version="${version%%-*}"
          code="$(echo "$code_version" | awk -F. '{ printf "%d", $1 * 10000 + $2 * 100 + $3 }')"
          echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "APK_NAME=asledger-$version.apk" >> "$GITHUB_ENV"

      # android-actions/setup-android@v3 вызывает устаревший пакет `tools`,
      # которого нет в cmdline-tools 16. Устанавливаем нужные пакеты напрямую.
      - name: Установить Android SDK 35 и 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты, lint и подписанный APK
        env:
          ASLEDGERD_BIN: ${{ github.workspace }}/bin/asledgerd
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon testDebugUnitTest verifyDataCoverage
          lintDebug ktlintCheck assembleRelease

      - name: Проверить подпись и версию APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | head -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n1)"
          # V1 (JAR)-подпись оставлена для совместимости с нестандартными
          # установщиками EMUI/HMS. Причиной #135 был minSdk 34 на устройстве
          # API 31, а не отсутствие v1.
          unzip -l "$apk" | grep -F "META-INF/MANIFEST.MF"
          unzip -l "$apk" | grep -E "META-INF/.*\.RSA|META-INF/.*\.DSA"
          "$apksigner" verify --print-certs "$apk"
          # v1 актуальна только до API 23, а apksigner по умолчанию берёт
          # minSdk из APK (31) и вообще не проверяет v1/v2. Поэтому для
          # проверки JAR-подписи явно задаём минимальный API.
          "$apksigner" verify --verbose --min-sdk-version 21 "$apk" \
            | grep -F "Verified using v1 scheme (JAR signing): true"
          "$apksigner" verify --verbose --min-sdk-version 24 "$apk" \
            | grep -F "Verified using v2 scheme (APK Signature Scheme v2): true"
          "$apksigner" verify --verbose --min-sdk-version 24 "$apk" \
            | grep -F "Verified using v3 scheme (APK Signature Scheme v3): true"
          # Выравнивание проверяем до публикации: повторный zipalign или
          # любая правка архива после apksigner разрушают блоки v2/v3.
          "$zipalign" -c -p 4 "$apk"
          "$aapt" dump badging "$apk" | grep -F "versionName='${ANDROID_VERSION_NAME}'"
          "$aapt" dump badging "$apk" | grep -F "versionCode='${ANDROID_VERSION_CODE}'"
          "$aapt" dump badging "$apk" | grep -F "sdkVersion:'31'"
          # Точка входа лаунчера обязана присутствовать в готовом APK, иначе
          # приложение ставится через adb, но не появляется в системе.
          "$aapt" dump badging "$apk" | grep -F "launchable-activity:"

      - name: Подготовить APK и SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/android-release/${APK_NAME}"
          cd "$RUNNER_TEMP/android-release"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"

      - name: Загрузить APK в черновик релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" "$RUNNER_TEMP"/android-release/* --clobber

  desktop-linux:
    name: Desktop Linux (release)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Установить кросс-компилятор arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Синхронизировать версию с тегом
        env:
          ASLEDGER_VERSION: ${{ github.ref_name }}
        run: npm run sync-version

      - name: Проверить версию
        env:
          ASLEDGER_VERSION: ${{ github.ref_name }}
        run: npm run verify:version

      - name: Проверки
        run: npm run check

      - name: Собрать Linux-пакет
        run: npm run package:dist

      - name: Проверить пакет
        run: npm run verify:package

      - name: Собрать Linux arm64
        run: npm run package:linux:arm64

      - name: Проверить пакет arm64
        run: npm run verify:package:linux:arm64

      - name: Подготовить артефакты и SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-linux"
          cp release/*.AppImage release/*.deb "$RUNNER_TEMP/desktop-linux/"
          cd "$RUNNER_TEMP/desktop-linux"
          sha256sum * > SHA256SUMS-linux

      - name: Загрузить Desktop Linux в черновик релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" "$RUNNER_TEMP"/desktop-linux/* --clobber

  desktop-windows:
    name: Desktop Windows (release)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Установить MinGW для cgo
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Добавить MinGW в PATH
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: Установить зависимости
        run: npm ci

      - name: Синхронизировать версию с тегом
        env:
          ASLEDGER_VERSION: ${{ github.ref_name }}
        run: npm run sync-version

      - name: Проверить версию
        env:
          ASLEDGER_VERSION: ${{ github.ref_name }}
        run: npm run verify:version

      - name: Проверки
        run: npm run check

      - name: Собрать Windows-пакет
        run: npm run package:win

      - name: Собрать Windows ZIP
        run: npm run package:win:zip

      - name: Проверить пакет
        run: npm run verify:package:win

      - name: Подготовить артефакты и SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\desktop-windows" | Out-Null
          Copy-Item release\*.exe "$env:RUNNER_TEMP\desktop-windows"
          Copy-Item release\*.zip "$env:RUNNER_TEMP\desktop-windows"
          $lines = Get-ChildItem "$env:RUNNER_TEMP\desktop-windows\*" -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF, чтобы `sha256sum -c` работал и в Git Bash.
          ($lines -join "`n") | Set-Content -NoNewline -Encoding utf8 `
            "$env:RUNNER_TEMP\desktop-windows\SHA256SUMS-windows"

      - name: Загрузить Desktop Windows в черновик релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem "$env:RUNNER_TEMP\desktop-windows" -File |
            Select-Object -ExpandProperty FullName
          gh release upload "$env:GITHUB_REF_NAME" -R "$env:GITHUB_REPOSITORY" @files --clobber

  release:
    name: Публикация релиза
    needs: [prepare, android, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Опубликовать черновик
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false
          gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --json isDraft,assets --jq '{isDraft, assets: [.assets[].name]}'
