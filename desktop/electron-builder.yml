appId: org.asledger.desktop
productName: asledger
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../assets/logo
    to: assets/logo
  - from: ../templates/charts
    to: templates/charts
  - from: ../LICENSE
    to: LICENSE
  - from: ../README.md
    to: README.md

afterPack: ./scripts/after-pack.cjs

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: ../assets/logo/icon-512.png
  maintainer: asledger contributors <noreply@asledger.invalid>
  syncDesktopName: true

win:
  target:
    - nsis
    - portable
  icon: ../assets/logo/icon-512.png
  # MVP без сертификата: не запускаем rcedit/подпись через wine.
  # На Windows-раннере CI можно включить обратно для метаданных exe.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}

# macOS не входит в MVP v1.3.2: нет сертификата и нотаризации.
# Поддержку и подпись добавим отдельной задачей после проверки требований.
