appId: org.asledger.desktop
productName: asledger
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

linux:
  target:
    - AppImage
  category: Office

win:
  target:
    - nsis

mac:
  target:
    - dmg
  category: public.app-category.finance
